<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车辆认证参数匹配工具</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --primary: #4a6cf7;
  --primary-hover: #3b5de7;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --info: #3b82f6;
  --bg: #f0f2f5;
  --card-bg: #ffffff;
  --text: #1f2937;
  --text-secondary: #6b7280;
  --border: #e5e7eb;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.1);
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 0.2s ease;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
}
header {
  background: var(--card-bg); border-bottom: 1px solid var(--border);
  padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
  box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100;
}
header h1 { font-size: 1.25rem; font-weight: 700; color: var(--text); }
.step-indicator { display: flex; gap: 8px; align-items: center; }
.step-dot {
  width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; font-weight: 600; border: 2px solid var(--border); color: var(--text-secondary);
  transition: var(--transition); background: var(--card-bg);
}
.step-dot.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.step-dot.done { background: var(--success); border-color: var(--success); color: #fff; }
.step-line { width: 24px; height: 2px; background: var(--border); }
.step-line.done { background: var(--success); }
main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
.card {
  background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 32px; margin-bottom: 24px;
}
.card-header { margin-bottom: 24px; }
.card-header h2 { font-size: 1.15rem; font-weight: 700; }
.card-header p { color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px; }
.step-card { display: none; }
.step-card.active { display: block; }

/* Upload zones */
.upload-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
.upload-zone {
  border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 32px 20px;
  text-align: center; cursor: pointer; transition: var(--transition); position: relative;
}
.upload-zone:hover, .upload-zone.drag-over { border-color: var(--primary); background: #f8faff; }
.upload-zone.has-file { border-color: var(--success); border-style: solid; background: #f8fdf9; }
.upload-icon { font-size: 2.5rem; margin-bottom: 8px; }
.upload-zone .title { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
.upload-zone .hint { font-size: 0.8rem; color: var(--text-secondary); }
.upload-zone input[type=file] { display: none; }
.file-info { margin-top: 12px; font-size: 0.85rem; color: var(--success); font-weight: 500; display: none; }
.has-file .file-info { display: block; }
.has-file .upload-icon, .has-file .hint { display: none; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 10px 24px;
  border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 600;
  border: none; cursor: pointer; transition: var(--transition);
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover:not(:disabled) { background: var(--border); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover:not(:disabled) { opacity: 0.9; }
.btn-lg { padding: 14px 36px; font-size: 1rem; }
.btn-row { display: flex; gap: 12px; margin-top: 20px; }

/* Alerts / Banners */
.alert { padding: 14px 18px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 0.9rem; }
.alert-info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
.alert-success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
.alert-warning { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }

/* Stats grid */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--bg); border-radius: var(--radius-sm); padding: 16px; text-align: center; }
.stat-card .stat-value { font-size: 1.5rem; font-weight: 700; }
.stat-card .stat-label { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }
.stat-card.match .stat-value { color: var(--success); }
.stat-card.unmatch .stat-value { color: var(--warning); }
.stat-card.dir .stat-value { color: var(--info); }

/* Tables */
.table-wrap { max-height: 500px; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th { background: #f9fafb; padding: 10px 12px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border); position: sticky; top: 0; white-space: nowrap; }
td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
tr:hover td { background: #f9fafb; }
.badge {
  display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
}
.badge-exact { background: #d1fae5; color: #065f46; }
.badge-fuzzy { background: #fef3c7; color: #92400e; }
.badge-dir { background: #dbeafe; color: #1e40af; }
.badge-nodata { background: #fee2e2; color: #991b1b; }

/* Filter bar */
.filter-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.filter-bar input { padding: 8px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; flex: 1; min-width: 200px; }
.filter-bar select { padding: 8px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; background: #fff; }
.filter-bar label { font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; }

/* Toast */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 12px 20px; border-radius: var(--radius-sm); color: #fff; font-size: 0.9rem;
  box-shadow: var(--shadow-lg); animation: slideIn 0.3s ease; max-width: 400px;
}
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
.toast-info { background: var(--info); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Multi-config selector */
.config-selector { display: flex; align-items: center; gap: 10px; margin: 12px 0; padding: 12px; background: var(--bg); border-radius: var(--radius-sm); }
.config-selector span { font-weight: 600; font-size: 0.9rem; }

/* Progress */
.progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 12px 0; }
.progress-bar .fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.5s ease; width: 0%; }

/* Summary download */
.download-summary { text-align: center; padding: 24px; }
.download-summary .big-icon { font-size: 4rem; margin-bottom: 12px; }
.download-summary .filename { font-weight: 700; color: var(--primary); font-size: 1.1rem; }

/* Responsive */
@media (max-width: 768px) {
  .upload-row { grid-template-columns: 1fr; }
  .card { padding: 20px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .step-dot { width: 26px; height: 26px; font-size: 0.7rem; }
}

.hidden { display: none !important; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.text-sm { font-size: 0.85rem; }
.text-center { text-align: center; }
.text-secondary { color: var(--text-secondary); }
</style>
</head>
<body>

<header>
  <h1>车辆认证参数匹配工具</h1>
  <div class="step-indicator" id="stepIndicator">
    <div class="step-dot active" data-step="1">1</div><div class="step-line" data-line="1"></div>
    <div class="step-dot" data-step="2">2</div><div class="step-line" data-line="2"></div>
    <div class="step-dot" data-step="3">3</div><div class="step-line" data-line="3"></div>
    <div class="step-dot" data-step="4">4</div>
  </div>
</header>

<main>
  <!-- STEP 1: Upload -->
  <div class="card step-card active" id="step1">
    <div class="card-header"><h2> 上传文件</h2><p>请分别上传备案参数模板和数据文件。模板上传一次后可重复使用。</p></div>
    <div class="upload-row">
      <div class="upload-zone" id="zoneTemplate">
        <div class="upload-icon"></div>
        <div class="title">备案参数模板（表1）</div>
        <div class="hint">拖拽 .xlsx / .xls 文件到此处，或点击选择</div>
        <div class="file-info" id="infoTemplate"></div>
        <input type="file" id="inputTemplate" accept=".xlsx,.xls">
      </div>
      <div class="upload-zone" id="zoneData">
        <div class="upload-icon"></div>
        <div class="title">3C / 公告数据文件（表2）</div>
        <div class="hint">拖拽 .xlsx / .xls 文件到此处，或点击选择</div>
        <div class="file-info" id="infoData"></div>
        <input type="file" id="inputData" accept=".xlsx,.xls">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary btn-lg" id="btnDetect" disabled> 检测格式并匹配</button>
    </div>
  </div>

  <!-- STEP 2: Detection & Match Preview -->
  <div class="card step-card" id="step2">
    <div class="card-header"><h2> 格式检测 & 匹配预览</h2><p>系统自动检测数据文件格式并进行参数匹配。</p></div>
    <div id="alertFormat"></div>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="config-selector hidden" id="configSelector">
      <span>配置选择：</span>
      <select id="selectConfig"><option value="0">默认配置（参数项的值）</option></select>
    </div>
    <div id="unmatchedList"></div>
    <h4 style="margin:16px 0 8px">匹配结果预览（按模板行，多配置值分列展示）</h4>
    <div class="table-wrap"><table id="previewTable"><thead><tr><th>#</th><th>系统参数编码</th><th>参数名称</th><th>3C序号</th><th>参数值</th><th>状态</th></tr></thead><tbody></tbody></table></div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btnBack1"> 上一步</button>
      <button class="btn btn-primary" id="btnGenerate"> 生成完整结果</button>
    </div>
  </div>

  <!-- STEP 3: Full Preview -->
  <div class="card step-card" id="step3">
    <div class="card-header"><h2> 完整结果预览</h2><p>查看所有参数的匹配结果，可使用筛选功能定位特定参数。</p></div>
    <div class="alert alert-success" id="alertMergeStats"></div>
    <div class="filter-bar">
      <input type="text" id="filterInput" placeholder="搜索参数名称或编码...">
      <label>状态筛选：</label>
      <select id="filterStatus"><option value="all">全部</option><option value="exact">精确匹配</option><option value="fuzzy">模糊匹配</option><option value="directory">目录行</option><option value="nodata">无数据</option></select>
      <span class="text-sm text-secondary" id="filterCount"></span>
    </div>
    <div class="table-wrap" style="max-height:450px"><table id="fullPreviewTable"><thead><tr><th>#</th><th>系统参数编码</th><th>参数名称</th><th>3C序号</th><th>参数值</th><th>状态</th></tr></thead><tbody></tbody></table></div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btnBack2"> 上一步</button>
      <button class="btn btn-success btn-lg" id="btnDownload"> 下载 XLSX</button>
    </div>
  </div>

  <!-- STEP 4: Download -->
  <div class="card step-card" id="step4">
    <div class="download-summary">
      <div class="big-icon"></div>
      <h2>导出就绪</h2>
      <p class="filename" id="dlFilename"></p>
      <p class="text-sm text-secondary mt-8" id="dlSummary"></p>
      <div class="btn-row" style="justify-content:center; margin-top:20px">
        <button class="btn btn-success btn-lg" id="btnDoDownload"> 下载 XLSX 文件</button>
      </div>
      <div class="btn-row" style="justify-content:center">
        <button class="btn btn-secondary" id="btnReset"> 重新开始</button>
      </div>
    </div>
  </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script>
(function() {
'use strict';

// ===== STATE =====
const state = {
  step: 1,
  templateFile: null, templateData: null, templateHeaders: null, templateRows: null,
  dataFile: null, dataFormat: null, dataHeaders: null, dataRows: null,
  keyColumn: null, valueColumns: [],
  index3C: new Map(), indexAnnounce: new Map(),
  matchResults: null, outputRows: null, outputHeaders: null,
  dirRowsCount: 0, paramRowsCount: 0,
  _colSysCode: null, _colName: null, _col3C: null, _colAnno: null, _colType: null,
  _tplValueCols: null
};

// ===== UTILS =====
const $ = (sel, ctx) => (ctx || document).querySelector(sel);
const $$ = (sel, ctx) => Array.from((ctx || document).querySelectorAll(sel));

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; }
function fmt(n) { return n.toLocaleString(); }

function normalizeKey(raw) {
  let s = String(raw ?? '').trim();
  // Full-width → half-width
  s = s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xfee0));
  s = s.replace(/[Ａ-Ｚ]/g, c => String.fromCharCode(c.charCodeAt(0)-0xff00));
  s = s.replace(/[ａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0)-0xff00));
  s = s.replace(/．/g, '.').replace(/（/g, '(').replace(/）/g, ')');
  s = s.replace(/　/g, ' ').trim();
  // For dotted numeric: strip leading zeros in each segment
  if (/^[\d.]+$/.test(s)) {
    s = s.split('.').map(seg => String(parseInt(seg, 10) || 0)).join('.');
  }
  return s;
}

function normHeader(h) {
  return String(h ?? '').trim()
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xfee0))
    .replace(/[Ａ-Ｚ]/g, c => String.fromCharCode(c.charCodeAt(0)-0xff00))
    .replace(/[ａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0)-0xff00))
    .replace(/\s+/g, '');
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  $('#toastContainer').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 3500);
}

// ===== STEP NAVIGATION =====
function goStep(n) {
  state.step = n;
  $$('.step-card').forEach(c => c.classList.remove('active'));
  $(`#step${n}`).classList.add('active');
  $$('.step-dot').forEach((d, i) => {
    d.classList.remove('active', 'done');
    if (i+1 < n) d.classList.add('done');
    if (i+1 === n) d.classList.add('active');
  });
  $$('.step-line').forEach((l, i) => {
    if (i+1 < n) l.classList.add('done'); else l.classList.remove('done');
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== FILE PARSER =====
async function parseFile(file) {
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const sn = wb.SheetNames[0];
  const ws = wb.Sheets[sn];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  if (!raw.length) throw new Error('文件为空');

  let headers = raw[0].map(normHeader);

  // Detect if headers are standard parameter-file headers
  // Standard: has a key column (序号/编码) AND a name column (参数项名称/参数名称)
  const hasKeyCol = headers.some(h => h === '序号' || h.includes('编码') || h.includes('参数序号'));
  const hasNameCol = headers.some(h => h.includes('参数项名称') || h === '参数名称');
  const hasValCol = headers.some(h => h.includes('参数项的值') || h.includes('参数值'));
  const hasStandardHeaders = (hasKeyCol && hasNameCol) || hasValCol;
  const nonEmptyHeaders = headers.filter(h => h.length > 0).length;

  // Also check data for parameter patterns
  const dataSample = raw.slice(1, Math.min(raw.length, 50));
  const hasDottedKeys = dataSample.some(r => /^\d+(\.\d+)+$/.test(String(r[0] ?? '').trim()));
  const hasQAKeys = dataSample.some(r => /^Q[A-Z]\d+$/.test(String(r[0] ?? '').trim()));
  const dataHasParamPattern = hasDottedKeys || hasQAKeys;

  if (!hasStandardHeaders || (!hasKeyCol && dataHasParamPattern) || nonEmptyHeaders <= 1) {
    // Generate synthetic headers for all columns
    const maxCols = Math.max(...raw.map(r => r.length), 5);
    headers = Array.from({length: maxCols}, (_, i) => 'col_' + (i + 1));
  }

  const rows = raw.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = r[i] ?? ''; });
    obj._rowIdx = raw.indexOf(r);
    return obj;
  });
  return { headers, rows, sheetName: sn, totalRows: rows.length };
}

// ===== FORMAT DETECTOR =====
function detectFormat(headers, rows) {
  function isValueCol(h) {
    return h.includes('参数项的值') || h.includes('参数值');
  }

  // === Try 3C detection ===
  const key3C = headers.find(h => h === '序号' || h.includes('序号'));
  const hasValCol = headers.some(h => isValueCol(h));
  const sample3C = key3C ? rows.slice(0, 100).filter(r => String(r[key3C] ?? '').trim()) : [];
  const dotMatch = sample3C.filter(r => /^\d+(\.\d+)*$/.test(String(r[key3C]).trim()));

  const score3C = (key3C ? 50 : 0) + (dotMatch.length > sample3C.length * 0.3 ? 40 : 0) + (hasValCol ? 30 : 0);

  if (score3C >= 50 && (hasValCol || dotMatch.length > 10)) {
    const valCols = [];
    headers.forEach(h => { if (isValueCol(h)) valCols.push(h); });
    valCols.sort((a, b) => {
      const ai = (a.match(/\((\d+)\)/) || [0, -1])[1];
      const bi = (b.match(/\((\d+)\)/) || [0, -1])[1];
      if (ai === -1 && bi === -1) return a.length - b.length;
      if (ai === -1) return -1;
      if (bi === -1) return 1;
      return parseInt(ai) - parseInt(bi);
    });
    return { format: '3C', confidence: Math.min(score3C/100, 1), keyColumn: key3C, valueColumns: valCols };
  }

  // === Try Announcement detection (QA-pattern codes) ===
  // Scan first column by default, then try all columns for QA codes
  const QA_RE = /^Q[A-Z]\d+$/;
  let bestKeyCol = null, bestKeyCount = 0;

  // Check each column header/index for QA codes in data
  const allHdrs = Object.keys(rows[0] || {}).filter(h => h); // All non-empty headers
  const colsToCheck = allHdrs.length > 0 ? allHdrs : headers.filter(h => h);

  colsToCheck.forEach(colHdr => {
    let qaCount = 0;
    const sample = rows.slice(0, Math.min(rows.length, 200));
    for (const r of sample) {
      const v = String(r[colHdr] ?? '').trim();
      if (QA_RE.test(v)) qaCount++;
    }
    if (qaCount > bestKeyCount) { bestKeyCount = qaCount; bestKeyCol = colHdr; }
  });

  if (bestKeyCount >= 5) {
    // Found announcement format — find value columns
    // First, identify the parameter name column to exclude it
    let nameCol = null;
    // Check if any header contains parameter name terms
    for (const h of allHdrs) {
      if (h.includes('参数项名称') || h.includes('参数名称') || h === '参数项名称' || h === '名称') {
        nameCol = h; break;
      }
    }
    // For synthetic headers (col_N), col_2 is typically the parameter name
    if (!nameCol && bestKeyCol.match(/^col_\d+$/)) {
      const keyNum = parseInt(bestKeyCol.replace('col_', ''));
      const candidateName = 'col_' + (keyNum + 1);
      if (allHdrs.includes(candidateName)) nameCol = candidateName;
    }
    // Heuristic: the column with the highest average string length among QA rows is likely the name
    if (!nameCol) {
      let maxAvgLen = 0;
      const qaSample = rows.filter(r => QA_RE.test(String(r[bestKeyCol] ?? '').trim())).slice(0, 50);
      allHdrs.filter(h => h !== bestKeyCol).forEach(h => {
        let totalLen = 0, count = 0;
        qaSample.forEach(r => { const v = String(r[h] ?? '').trim(); if (v) { totalLen += v.length; count++; } });
        const avg = count > 0 ? totalLen / count : 0;
        if (avg > maxAvgLen && avg > 8) { maxAvgLen = avg; nameCol = h; }
      });
    }

    // Value columns are those with data in the QA rows (excluding the key and name cols)
    const valColCandidates = allHdrs.filter(h => h !== bestKeyCol && h !== nameCol);
    const valCols = [];

    // Score each candidate column by how many QA rows have non-empty values
    const qaRows = rows.filter(r => QA_RE.test(String(r[bestKeyCol] ?? '').trim()));
    valColCandidates.forEach(colHdr => {
      let filledCount = 0;
      for (const r of qaRows.slice(0, 200)) {
        const v = String(r[colHdr] ?? '').trim();
        if (v && v.length > 0) filledCount++;
      }
      // Consider it a value column if >5% of QA rows have data
      if (filledCount > qaRows.length * 0.03) {
        valCols.push(colHdr);
      }
    });

    // Sort: columns without (N) suffix first, then (1), (2), (3)
    valCols.sort((a, b) => {
      const ai = (a.match(/\((\d+)\)/) || [0, -1])[1];
      const bi = (b.match(/\((\d+)\)/) || [0, -1])[1];
      if (ai === -1 && bi === -1) return 0;
      if (ai === -1) return -1;
      if (bi === -1) return 1;
      return parseInt(ai) - parseInt(bi);
    });

    return { format: 'announcement', confidence: Math.min(bestKeyCount / qaRows.length, 1),
      keyColumn: bestKeyCol, valueColumns: valCols };
  }

  // Fallback
  return { format: 'unknown', confidence: 0, keyColumn: null, valueColumns: [] };
}

// ===== TEMPLATE LOADER =====
function loadTemplate(headers, rows) {
  // Find key columns
  const hdrs = headers;
  const colSysCode = hdrs.find(h => h.includes('系统参数编码'));
  const colName = hdrs.find(h => h === '参数名称' || h.includes('参数名称'));
  const col3C = hdrs.find(h => h === '3C参数序号' || (h.includes('3C') && h.includes('参数序号')));
  const colAnno = hdrs.find(h => h.includes('公告参数序号') || h.includes('公告参数编号') || h.includes('公告参数编码'));
  const colType = hdrs.find(h => h === '参数项类型' || h.includes('参数项类型'));

  // Find existing value columns in template (for filling)
  // Config 0: "参数值" or "参数项的值" or "默认值" (exact match to avoid false positives)
  function isExactValCol0(h) {
    return h === '参数值' || h === '参数项的值' || h === '默认值';
  }
  const colTplVal0 = hdrs.find(h => isExactValCol0(h));
  // Config 1-3: "关键参数值(N)" (exact) or header containing "参数值(N)"
  function isValColN(h, n) {
    return h === '关键参数值(' + n + ')' || h === '参数值(' + n + ')' || h === '参数项的值(' + n + ')';
  }
  const colTplVal1 = hdrs.find(h => isValColN(h, 1));
  const colTplVal2 = hdrs.find(h => isValColN(h, 2));
  const colTplVal3 = hdrs.find(h => isValColN(h, 3));
  const tplValueCols = [colTplVal0, colTplVal1, colTplVal2, colTplVal3];

  if (!colSysCode) throw new Error('模板文件缺少"系统参数编码"列，请确认上传的是备案参数模板。');

  const index3C = new Map();
  const indexAnno = new Map();
  let dirCount = 0, paramCount = 0;

  rows.forEach((row, i) => {
    const type = colType ? String(row[colType] ?? '').trim() : '';
    if (type === '目录') {
      dirCount++;
      row._rowType = 'directory';
    } else {
      paramCount++;
      row._rowType = 'parameter';
    }
    row._idx = i;

    if (col3C) {
      const k3c = normalizeKey(row[col3C]);
      if (k3c) {
        if (!index3C.has(k3c)) index3C.set(k3c, []);
        index3C.get(k3c).push({ row, idx: i });
      }
    }
    if (colAnno) {
      const ka = normalizeKey(row[colAnno]);
      if (ka) {
        if (!indexAnno.has(ka)) indexAnno.set(ka, []);
        indexAnno.get(ka).push({ row, idx: i });
      }
    }
  });

  return { index3C, indexAnno, colSysCode, colName, col3C, colAnno, colType,
    tplValueCols, dirCount, paramCount };
}

// ===== MATCHER =====
// Returns: { valueMap: Map<templateRowIdx, {configValues: Map<ci,{value,type}>, dataKey, matchType}>,
//            unmatched: [...], stats: {...}, configCount }
function matchData(dataRows, keyColumn, valueColumns, templateIndex, formatType) {
  // valueMap: templateRow._idx → { configValues: Map<configIndex, {value, type}>, dataKey, matchType }
  const valueMap = new Map();
  const unmatched = [];

  function addMatch(tplRow, dataKey, configIndex, value, matchType) {
    const tidx = tplRow._idx;
    if (!valueMap.has(tidx)) {
      valueMap.set(tidx, { configValues: new Map(), dataKey, matchType });
    }
    const entry = valueMap.get(tidx);
    // Exact match takes priority over fuzzy
    if (matchType === 'exact') entry.matchType = 'exact';
    // Don't overwrite existing exact match values
    if (!entry.configValues.has(configIndex)) {
      entry.configValues.set(configIndex, { value, type: matchType });
    } else if (matchType === 'exact') {
      // Overwrite fuzzy with exact
      entry.configValues.set(configIndex, { value, type: 'exact' });
    }
  }

  // First pass: exact key match
  dataRows.forEach(row => {
    const rawKey = String(row[keyColumn] ?? '').trim();
    if (!rawKey) return;
    const nk = normalizeKey(rawKey);
    const tpls = templateIndex.get(nk);

    if (tpls && tpls.length > 0) {
      valueColumns.forEach((valCol, ci) => {
        const val = String(row[valCol] ?? '').trim();
        if (val) {
          tpls.forEach(tpl => {
            addMatch(tpl.row, nk, ci, val, 'exact');
          });
        }
      });
      // Also ensure template row gets a match even if all values empty
      const hasInMap = tpls.some(tpl => valueMap.has(tpl.row._idx));
      if (!hasInMap) {
        tpls.forEach(tpl => {
          addMatch(tpl.row, nk, 0, '', 'exact');
        });
      }
    } else {
      unmatched.push({ dataRow: row, dataKey: nk, reason: 'no_match' });
    }
  });

  // Second pass: fuzzy matching for unmatched rows
  let fuzzyCount = 0;
  if (formatType === '3C') {
    const stillUnmatched = [];
    unmatched.forEach(item => {
      let foundTpl = null;
      const parts = item.dataKey.split('.');
      for (let len = parts.length - 1; len >= 1; len--) {
        const parentKey = parts.slice(0, len).join('.');
        const tpls = templateIndex.get(parentKey);
        if (tpls && tpls.length > 0) {
          const tpl = tpls.find(t => t.row._rowType !== 'directory');
          if (tpl) {
            foundTpl = { tpl, parentKey, similarity: len / parts.length };
            break;
          }
        }
      }

      if (foundTpl) {
        let hasValue = false;
        valueColumns.forEach((valCol, ci) => {
          const val = String(item.dataRow[valCol] ?? '').trim();
          if (val) {
            hasValue = true;
            addMatch(foundTpl.tpl.row, foundTpl.parentKey, ci, val, 'fuzzy');
            fuzzyCount++;
          }
        });
        if (!hasValue) {
          addMatch(foundTpl.tpl.row, foundTpl.parentKey, 0, '', 'fuzzy');
        }
      } else {
        stillUnmatched.push(item);
      }
    });
    unmatched.length = 0;
    unmatched.push(...stillUnmatched);
  }

  // Count actual matched template rows
  const matchedCount = valueMap.size;
  const totalConfigEntries = Array.from(valueMap.values()).reduce((sum, v) => sum + v.configValues.size, 0);

  return { valueMap, unmatched, totalData: dataRows.length,
    configCount: valueColumns.length,
    stats: { matched: matchedCount, unmatched: unmatched.length, fuzzy: fuzzyCount, totalEntries: totalConfigEntries } };
}

// ===== MERGER =====
// One row per template row. Fills config values into designated columns.
function mergeResults(templateRows, matchResults) {
  const { valueMap, configCount } = matchResults;
  const maxCi = Math.max(0, configCount - 1);

  const output = templateRows.map(row => {
    const out = { ...row };
    const entry = valueMap.get(row._idx);

    if (row._rowType === 'directory') {
      out._matchType = 'directory';
      for (let ci = 0; ci <= maxCi; ci++) out['_val' + ci] = '';
    } else if (entry) {
      out._matchType = entry.matchType || 'exact';
      for (let ci = 0; ci <= maxCi; ci++) {
        const cv = entry.configValues.get(ci);
        out['_val' + ci] = cv ? cv.value : '';
      }
    } else {
      out._matchType = 'nodata';
      for (let ci = 0; ci <= maxCi; ci++) out['_val' + ci] = '';
    }
    return out;
  });

  return output;
}

// ===== EXPORTER =====
// Preserves all template columns. Fills data values into matching template value columns.
// If template lacks value columns, appends them.
function exportXLSX(outputRows, templateHeaders) {
  // Determine max config index from data or match results
  const cfgCount = state.matchResults ? state.matchResults.configCount : 1;
  let actualMaxCi = Math.min(cfgCount - 1, 3);
  for (const r of outputRows) {
    for (let ci = 3; ci >= 0; ci--) {
      if (r['_val' + ci] && String(r['_val' + ci]).trim()) {
        actualMaxCi = Math.max(actualMaxCi, ci);
        break;
      }
    }
  }
  actualMaxCi = Math.max(0, actualMaxCi);

  // Check which value columns already exist in template
  const existingValCols = state._tplValueCols || [null, null, null, null];
  const hasAnyTplValCol = existingValCols.some(c => c != null);

  // If template has NO pre-defined value columns, export template as-is (no extra columns)
  // Values can be viewed in the Step 3 preview instead
  const valColNames = ['参数值', '关键参数值(1)', '关键参数值(2)', '关键参数值(3)'];
  const needsNewCol = [];
  if (hasAnyTplValCol) {
    for (let ci = 0; ci <= actualMaxCi; ci++) {
      if (!existingValCols[ci]) needsNewCol.push(ci);
    }
  }
  // If no value columns in template at all → don't append, export template pure
  const outHeaders = hasAnyTplValCol
    ? [...templateHeaders, ...needsNewCol.map(ci => valColNames[ci] || ('参数值(' + ci + ')'))]
    : templateHeaders;

  const data = outputRows.map(row => {
    const templateVals = templateHeaders.map(h => {
      for (let ci = 0; ci <= actualMaxCi; ci++) {
        if (existingValCols[ci] === h) {
          return String(row['_val' + ci] ?? '');
        }
      }
      return String(row[h] ?? '');
    });
    if (hasAnyTplValCol) {
      const extraVals = needsNewCol.map(ci => String(row['_val' + ci] ?? ''));
      return [...templateVals, ...extraVals];
    }
    return templateVals;
  });

  const wsData = [outHeaders, ...data];
  const ws = XLSX.utils.aoa_to_sheet(wsData);

  // Column widths
  const colWidths = outHeaders.map((h, ci) => {
    let max = h.length * 2;
    for (let ri = 0; ri < Math.min(data.length, 500); ri++) {
      const v = String(data[ri][ci] ?? '');
      max = Math.max(max, v.length * 1.2);
    }
    return { wch: Math.min(Math.max(max, 8), 60) };
  });
  ws['!cols'] = colWidths;

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '填报结果');

  // Unmatched sheet
  const unmatchedItems = outputRows.filter(r => r._matchType === 'nodata' && r._rowType === 'parameter');
  if (unmatchedItems.length > 0) {
    const umHeaders = ['系统参数编码', '参数名称', '3C参数序号', '公告参数序号', '状态'];
    const umData = unmatchedItems.map(r => [
      String(r[state._colSysCode] ?? ''), String(r[state._colName] ?? ''),
      String(r[state._col3C] ?? ''), String(r[state._colAnno] ?? ''),
      '无匹配数据'
    ]);
    const umWs = XLSX.utils.aoa_to_sheet([umHeaders, ...umData]);
    XLSX.utils.book_append_sheet(wb, umWs, '未匹配参数项');
  }

  const now = new Date();
  const dateStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  const filename = `备案参数模板_填报结果_${dateStr}.xlsx`;
  XLSX.writeFile(wb, filename);
  return filename;
}

// ===== UI HANDLERS =====
function setupDropZone(zoneId, inputId, infoId, onFile) {
  const zone = $(`#${zoneId}`);
  const input = $(`#${inputId}`);
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && (file.name.endsWith('.xlsx') || file.name.endsWith('.xls'))) { onFile(file); } else { toast('请上传 .xlsx 或 .xls 文件', 'error'); }
  });
  input.addEventListener('change', () => {
    if (input.files[0]) onFile(input.files[0]);
  });
}

async function onTemplateFile(file) {
  try {
    state.templateFile = file;
    const parsed = await parseFile(file);
    state.templateHeaders = parsed.headers;
    state.templateRows = parsed.rows;
    state.templateData = parsed;
    $(`#${'infoTemplate'}`).textContent = `${file.name} (${parsed.sheetName}, ${fmt(parsed.totalRows)} 行)`;
    $('#zoneTemplate').classList.add('has-file');
    checkStep1Ready();
    toast(`模板加载成功：${fmt(parsed.totalRows)} 行`, 'success');
  } catch (e) {
    toast('模板文件解析失败: ' + e.message, 'error');
  }
}

async function onDataFile(file) {
  try {
    state.dataFile = file;
    const parsed = await parseFile(file);
    state.dataHeaders = parsed.headers;
    state.dataRows = parsed.rows;
    $(`#${'infoData'}`).textContent = `${file.name} (${parsed.sheetName}, ${fmt(parsed.totalRows)} 行)`;
    $('#zoneData').classList.add('has-file');
    checkStep1Ready();
    toast(`数据文件加载成功：${fmt(parsed.totalRows)} 行`, 'success');
  } catch (e) {
    toast('数据文件解析失败: ' + e.message, 'error');
  }
}

function checkStep1Ready() {
  $('#btnDetect').disabled = !(state.templateData && state.dataRows);
}

// ===== STEP 2: DETECT & MATCH =====
function doDetectAndMatch() {
  try {
    // Load template
    const tpl = loadTemplate(state.templateHeaders, state.templateRows);
    state.index3C = tpl.index3C;
    state.indexAnnounce = tpl.indexAnno;
    state.dirRowsCount = tpl.dirCount;
    state.paramRowsCount = tpl.paramCount;
    state._colSysCode = tpl.colSysCode;
    state._colName = tpl.colName;
    state._col3C = tpl.col3C;
    state._colAnno = tpl.colAnno;
    state._colType = tpl.colType;
    state._tplValueCols = tpl.tplValueCols;

    // Detect format
    const det = detectFormat(state.dataHeaders, state.dataRows);
    state.dataFormat = det.format;
    state.keyColumn = det.keyColumn;
    state.valueColumns = det.valueColumns;

    // Show multi-config info if multiple value columns detected
    if (det.valueColumns.length > 1) {
      const labels = det.valueColumns.map((col, i) => '配置' + (i+1) + '（' + col + '）').join('、');
      $('#configSelector').classList.remove('hidden');
      $('#configSelector').querySelector('span').textContent = '检测到 ' + det.valueColumns.length + ' 个值列：' + labels;
    } else {
      $('#configSelector').classList.add('hidden');
    }

    // Match (uses ALL value columns now)
    const index = det.format === '3C' ? state.index3C : state.indexAnnounce;
    const results = matchData(state.dataRows, det.keyColumn, det.valueColumns, index, det.format);
    state.matchResults = results;

    // Render step 2
    renderStep2(results, det);
    goStep(2);
  } catch (e) {
    console.error(e);
    toast('匹配失败: ' + e.message, 'error');
  }
}

function renderStep2(results, det) {
  // Format alert
  const formatName = det.format === '3C' ? '3C 认证数据格式' : '公告参数格式';
  const cfgCount = results.configCount || det.valueColumns.length;
  // Friendly column descriptions for synthetic headers
  const keyDesc = det.keyColumn && det.keyColumn.match(/^col_(\d+)$/) ? '第' + RegExp.$1 + '列（公告参数编码）' : det.keyColumn;
  const valDesc = det.valueColumns.map(c => c && c.match(/^col_(\d+)$/) ? '第' + RegExp.$1 + '列' : c).join('、');
  $('#alertFormat').innerHTML = `<div class="alert alert-info"><strong>检测结果：</strong>${formatName}（置信度 ${Math.round(det.confidence*100)}%）<br>匹配键列：${escapeHtml(keyDesc)}<br>值列（${cfgCount} 个配置）：${escapeHtml(valDesc)}</div>`;

  // Stats
  const multiConfigCount = state.dataRows.filter(r => {
    return det.valueColumns.slice(1).some(c => String(r[c] ?? '').trim());
  }).length;
  $('#statsGrid').innerHTML = `
    <div class="stat-card match"><div class="stat-value">${fmt(results.stats.matched)}</div><div class="stat-label">已匹配模板行</div></div>
    <div class="stat-card unmatch"><div class="stat-value">${fmt(results.stats.unmatched)}</div><div class="stat-label">未匹配数据行</div></div>
    <div class="stat-card dir"><div class="stat-value">${fmt(results.stats.totalEntries)}</div><div class="stat-label">配置值条目</div></div>
    <div class="stat-card"><div class="stat-value">${cfgCount}</div><div class="stat-label">检测配置列数</div></div>
    <div class="stat-card"><div class="stat-value">${fmt(multiConfigCount)}</div><div class="stat-label">多配置数据行</div></div>
    <div class="stat-card"><div class="stat-value">${fmt(state.dataRows.length)}</div><div class="stat-label">数据文件行数</div></div>`;

  // Unmatched list
  const allUnmatched = [...results.unmatched];
  if (allUnmatched.length > 0) {
    let html = `<div class="alert alert-warning"><strong>${allUnmatched.length} 个数据行未能匹配到模板参数：</strong><ul style="margin:8px 0 0 20px;max-height:120px;overflow:auto">`;
    allUnmatched.slice(0, 30).forEach(u => {
      const name = String(u.dataRow[Object.keys(u.dataRow).find(k => k.includes('参数项名称') || k.includes('名称')) || ''] ?? '').trim();
      html += `<li>序号 "${escapeHtml(u.dataKey)}" - ${escapeHtml(name || '未知参数')}</li>`;
    });
    if (allUnmatched.length > 30) html += `<li>... 还有 ${allUnmatched.length - 30} 个</li>`;
    html += '</ul></div>';
    $('#unmatchedList').innerHTML = html;
  } else {
    $('#unmatchedList').innerHTML = '';
  }

  // Preview table — show first 15 matched template rows with all config values
  const configCount = cfgCount;
  // Build config value column headers dynamically
  const valColNames = ['参数值', '关键参数值(1)', '关键参数值(2)', '关键参数值(3)'];
  const cfgHeaders = Array.from({length: Math.min(configCount, 4)}, (_, i) => valColNames[i] || '参数值('+ (i+1) +')');
  const cfgThHtml = cfgHeaders.map(h => `<th>${escapeHtml(h)}</th>`).join('');
  const keyLabel = det.format === '3C' ? '3C序号' : '公告序号';
  $('#previewTable thead tr').innerHTML = '<th>#</th><th>系统参数编码</th><th>参数名称</th><th>' + keyLabel + '</th>' + cfgThHtml + '<th>状态</th>';

  let tbody = '';
  const entries = Array.from(results.valueMap.entries()).slice(0, 15);
  entries.forEach(([tidx, entry], idx) => {
    // Find the template row to get its name
    const tplRow = state.templateRows[tidx];
    if (!tplRow) return;
    const code = String(tplRow[state._colSysCode] ?? '');
    const name = String(tplRow[state._colName] ?? '');
    const keyVal = det.format === '3C' ? String(tplRow[state._col3C] ?? '') : String(tplRow[state._colAnno] ?? '');
    const status = entry.matchType === 'exact' ? '<span class="badge badge-exact">精确匹配</span>' : '<span class="badge badge-fuzzy">模糊匹配</span>';
    const cfgVals = Array.from({length: Math.min(configCount, 4)}, (_, ci) => {
      const cv = entry.configValues.get(ci);
      return '<td>' + escapeHtml(cv ? cv.value : '') + '</td>';
    }).join('');
    tbody += `<tr><td>${idx+1}</td><td>${escapeHtml(code)}</td><td>${escapeHtml(name)}</td><td>${escapeHtml(keyVal)}</td>${cfgVals}<td>${status}</td></tr>`;
  });
  $('#previewTable tbody').innerHTML = tbody;
}

// ===== STEP 3: FULL PREVIEW =====
function doGenerate() {
  state.outputRows = mergeResults(state.templateRows, state.matchResults);
  state.outputHeaders = state.templateHeaders;
  renderFullPreview();
  goStep(3);
}

function renderFullPreview(filterText, filterStatus) {
  const ft = (filterText || '').toLowerCase();
  const fs = filterStatus || 'all';
  let filtered = state.outputRows;

  // Build config value column headers
  const maxCi = state.matchResults ? (state.matchResults.configCount || state.valueColumns.length) - 1 : 0;
  const actualMaxCi = Math.max(0, Math.min(maxCi, 3));
  const valColNames = ['参数值', '关键参数值(1)', '关键参数值(2)', '关键参数值(3)'];

  if (ft) {
    filtered = filtered.filter(r => {
      if (String(r[state._colSysCode] ?? '').toLowerCase().includes(ft)) return true;
      if (String(r[state._colName] ?? '').toLowerCase().includes(ft)) return true;
      for (let ci = 0; ci <= actualMaxCi; ci++) {
        if (String(r['_val' + ci] ?? '').toLowerCase().includes(ft)) return true;
      }
      return false;
    });
  }
  if (fs !== 'all') {
    filtered = filtered.filter(r => r._matchType === fs);
  }

  // Update table header dynamically
  const cfgThHtml = Array.from({length: actualMaxCi + 1}, (_, i) =>
    '<th>' + escapeHtml(valColNames[i] || ('参数值('+ (i+1) +')')) + '</th>'
  ).join('');
  const keyLabel2 = state.dataFormat === '3C' ? '3C序号' : '公告序号';
  $('#fullPreviewTable thead tr').innerHTML = '<th>#</th><th>系统参数编码</th><th>参数名称</th><th>' + keyLabel2 + '</th>' + cfgThHtml + '<th>状态</th>';

  let tbody = '';
  filtered.slice(0, 500).forEach((r, i) => {
    const code = String(r[state._colSysCode] ?? '');
    const name = String(r[state._colName] ?? '');
    const fmtKey = state.dataFormat === '3C' ? String(r[state._col3C] ?? '') : String(r[state._colAnno] ?? '');
    const cfgVals = Array.from({length: actualMaxCi + 1}, (_, ci) =>
      '<td>' + escapeHtml(String(r['_val' + ci] ?? '')) + '</td>'
    ).join('');
    let badge = '';
    switch (r._matchType) {
      case 'exact': badge = '<span class="badge badge-exact">精确匹配</span>'; break;
      case 'fuzzy': badge = '<span class="badge badge-fuzzy">模糊匹配</span>'; break;
      case 'directory': badge = '<span class="badge badge-dir">目录</span>'; break;
      default: badge = '<span class="badge badge-nodata">无数据</span>'; break;
    }
    tbody += `<tr><td>${i+1}</td><td>${escapeHtml(code)}</td><td>${escapeHtml(name)}</td><td>${escapeHtml(fmtKey)}</td>${cfgVals}<td>${badge}</td></tr>`;
  });

  $('#fullPreviewTable tbody').innerHTML = tbody;
  $('#filterCount').textContent = `显示 ${filtered.length} / ${state.outputRows.length} 行`;

  // Merge stats
  const filled0 = state.outputRows.filter(r => r._val0 && String(r._val0).trim()).length;
  const filled1 = state.outputRows.filter(r => r._val1 && String(r._val1).trim()).length;
  const filled2 = state.outputRows.filter(r => r._val2 && String(r._val2).trim()).length;
  const filled3 = state.outputRows.filter(r => r._val3 && String(r._val3).trim()).length;
  const dirs = state.outputRows.filter(r => r._matchType === 'directory').length;
  const nodata = state.outputRows.filter(r => r._matchType === 'nodata').length;
  const fuzzy = state.outputRows.filter(r => r._matchType === 'fuzzy').length;
  $('#alertMergeStats').innerHTML = `<strong>合并统计：</strong>共 ${fmt(state.outputRows.length)} 行，配置1填写 ${fmt(filled0)} 项，配置2填写 ${fmt(filled1)} 项，配置3填写 ${fmt(filled2)} 项，配置4填写 ${fmt(filled3)} 项，模糊匹配 ${fmt(fuzzy)} 项，无数据 ${fmt(nodata)} 项`;
}

// ===== STEP 4: DOWNLOAD =====
function doDownload() {
  const filename = exportXLSX(state.outputRows, state.outputHeaders);
  const filled0 = state.outputRows.filter(r => r._val0 && String(r._val0).trim()).length;
  const filled1 = state.outputRows.filter(r => r._val1 && String(r._val1).trim()).length;
  const nodata = state.outputRows.filter(r => r._matchType === 'nodata').length;
  const maxCi = state.matchResults ? state.matchResults.configCount : 1;
  const hasTplValCols = (state._tplValueCols || []).some(c => c != null);
  $('#dlFilename').textContent = filename;
  if (hasTplValCols) {
    $('#dlSummary').textContent = `${fmt(state.outputRows.length)} 行，${maxCi} 个配置列已填入模板对应列，${fmt(filled0)} 项有值，${fmt(nodata)} 项无数据`;
  } else {
    $('#dlSummary').textContent = `${fmt(state.outputRows.length)} 行已导出（模板原始结构），${fmt(filled0)} 项已匹配（预览可见），${fmt(nodata)} 项无数据。如需填入参数值列，请使用含「参数值」列的模板`;
  }
  goStep(4);
}

function doReset() {
  Object.assign(state, {
    step: 1, templateFile: null, templateData: null, templateHeaders: null, templateRows: null,
    dataFile: null, dataFormat: null, dataHeaders: null, dataRows: null,
    keyColumn: null, valueColumns: [],
    index3C: new Map(), indexAnnounce: new Map(),
    matchResults: null, outputRows: null, outputHeaders: null, dirRowsCount: 0, paramRowsCount: 0,
    _colSysCode: null, _colName: null, _col3C: null, _colAnno: null, _colType: null,
    _tplValueCols: null
  });
  $('#zoneTemplate').classList.remove('has-file');
  $('#zoneData').classList.remove('has-file');
  $('#infoTemplate').textContent = '';
  $('#infoData').textContent = '';
  $('#inputTemplate').value = '';
  $('#inputData').value = '';
  $('#btnDetect').disabled = true;
  goStep(1);
}

// ===== INIT =====
function init() {
  setupDropZone('zoneTemplate', 'inputTemplate', 'infoTemplate', onTemplateFile);
  setupDropZone('zoneData', 'inputData', 'infoData', onDataFile);

  $('#btnDetect').addEventListener('click', doDetectAndMatch);
  $('#btnBack1').addEventListener('click', () => goStep(1));
  $('#btnGenerate').addEventListener('click', doGenerate);
  $('#btnBack2').addEventListener('click', () => goStep(2));
  $('#btnDownload').addEventListener('click', doDownload);
  $('#btnDoDownload').addEventListener('click', () => {
    const filename = exportXLSX(state.outputRows, state.outputHeaders);
    toast(`已下载：${filename}`, 'success');
  });
  $('#btnReset').addEventListener('click', doReset);
  $('#filterInput').addEventListener('input', function() {
    renderFullPreview(this.value, $('#filterStatus').value);
  });
  $('#filterStatus').addEventListener('change', function() {
    renderFullPreview($('#filterInput').value, this.value);
  });
}

document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
